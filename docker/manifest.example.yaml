# CryptDough cross-organizational run manifest.
#
# ONE of these is agreed between the parties before a run and distributed to all of
# them. Every party checks its local build against it with docker/check-manifest.sh.
#
# Why this file exists: the port each connection uses is
#     base_port + num_parties * threads * i + threads * j
# so if the parties disagree about `threads`, the port arithmetic diverges and nothing
# connects -- with no error message that explains why. The same is true of every
# compile-time protocol option: a mismatch produces a hang or, worse, a wrong answer.

run_id: 2026-09-example
git_commit: 0000000000000000000000000000000000000000   # exact SHA every party builds

# --- Party assignment -------------------------------------------------------
#
# Order is rank order and is significant. Party i connects to every j > i and listens
# for every j < i, so:
#   * rank 0 needs NO inbound ports at all -- give it to the most firewalled party
#   * rank 2 is the most exposed -- give it to whoever can open ports most easily
parties:
  - rank: 0
    org: "Organization A"
    host: "mpc-a.example.edu"     # resolvable by the other parties
    cert: "party0.crt"
  - rank: 1
    org: "Organization B"
    host: "mpc-b.example.org"
    cert: "party1.crt"
  - rank: 2
    org: "Organization C"
    host: "mpc-c.example.com"
    cert: "party2.crt"

# --- Network ----------------------------------------------------------------
base_port: 20000

# --- Runtime arguments (identical for every party) --------------------------
# Written verbatim into a file consumed with the framework's own -f/--file-args
# mechanism (include/backend/common/setup.h), so no party can drift.
program: mpc-analysis
runtime_args:
  threads: 8          # -t   MUST match: the port arithmetic depends on it
  num_engines: 1      # -neng
  stage: models       # -S   kernels | describe | models | bench
  data_dir: /data     # -D   each party's own mount; see the data block below
  conflict_list: 0    # -cl  1 also runs the MRN cross-check, which opens a count

# --- Compile-time options (identical for every party) -----------------------
# These change the wire protocol or the computation; a mismatch is silent.
cmake:
  PROTOCOL: 3         # replicated 3PC (Araki et al.) -- SEMI-HONEST, see DEPLOYMENT.md
  COMM: NOCOPY
  COMM_THREADS: 4
  TLS: "ON"           # mutually-authenticated TLS 1.3; must match everywhere
  TRIPLES: ZERO
  DEFAULT_BITWIDTH: 32
  SORT_PROTO: QUICKSORT
  BOOLEAN_ADDER: AUTO
  DIVISION_CORRECTION: "ON"

# May differ per party (each builds on its own CPU):
#   OPT_LEVEL, and the -march=native the compiler selects.

# --- Data -------------------------------------------------------------------
#
# TWO data owners, each holding its own half of cdrcatsse_match_pcc -- the top of
# the lineage, with the diagnosis text intact. Only the owning party ever opens
# its file; the others allocate placeholders and receive shares. The plaintext
# never crosses the network.
#
# A three-party run has two data owners and one compute party. Rank 2 below
# contributes no data and still participates in the protocol.
#
# Do NOT stage finished analysis tables here. visit_num, index_visit,
# final_visit and fu_month are window functions over a patient's whole history,
# and that history spans both organizations, so no owner can compute them from
# its own rows. The protocol produces them, in shares.
data:
  mount: /data                     # each owner mounts ITS OWN directory here
  owners:
    - owner_rank: 0                # -pa
      file: base_owner_a.csv       # -fa
      rows: 240                    # -ra   POST-FILTER count, see below
    - owner_rank: 1                # -pb
      file: base_owner_b.csv       # -fb
      rows: 256                    # -rb

  # `rows` is NOT the file's line count. flagged_dx pass 1 keeps only Emergency
  # and Acute Care encounters, so this is what survives that filter: the number
  # of rows the owner actually contributes. Both halves are padded to one common
  # length derived from both counts, so a party owning neither still needs them,
  # and a file disagreeing with its declared count is a fatal error.
  #
  # Each owner computes its own number locally, before this file is agreed:
  #     ./docker/count-analysis-rows.py /srv/org-a/private/base_owner_a.csv
  #
  # The pipeline's plaintext cross-check needs both halves at once and therefore
  # does not exist in a real run. See DEPLOYMENT.md, "Private data".
